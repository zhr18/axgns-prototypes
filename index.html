<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AX GANES Home Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --a:#305CFF;--a08:rgba(48,92,255,.08);--a15:rgba(48,92,255,.15);--a30:rgba(48,92,255,.3);
  --t1:#101828;--t2:#344054;--t3:#475467;--t4:#5D6676;--t5:#98A2B3;
  --bd:#E6E8EC;--bd2:#E1E4EA;--bd3:#DADDE3;--bg:#F6F7F9;--card:#FFFFFF;--red:#D92D20;--red2:#B42318;
  --desk:#E4E6EB;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--t1);overflow:hidden}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ---------- POC tools (same look as AX_GANES_Chat_Menus_POC) ---------- */
.pocb{position:fixed;right:16px;bottom:16px;z-index:9000;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:#0B1020;color:#E5E7EB;font:600 12px/1 system-ui,sans-serif;cursor:pointer}
.pocb kbd,.poc kbd{font:600 11px ui-monospace,monospace;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.1);color:#E5E7EB}
.pocb .pxrl{padding:3px 7px;border-radius:4px;background:#1E8FFF;color:#fff}
.poc{position:fixed;top:0;right:0;bottom:0;width:min(360px,34vw);min-width:300px;z-index:9001;display:none;flex-direction:column;background:#0B1020;color:#C9CED8;border-left:1px solid rgba(255,255,255,.12);font:13px/1.45 system-ui,sans-serif}
.poc.on{display:flex}
.poc header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.poc header b{color:#fff;font-size:14px}.poc header i{font-style:normal;color:#8A8A92;margin-left:6px}
.poc header button{background:none;border:0;color:#C9CED8;font-size:20px;cursor:pointer}
.poc .pxbd{overflow:auto;flex:1}
.poc .pxpn{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.poc h3{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8A8A92}
.poc .pxmut{color:#8A8A92;font-size:12px}
.poc .pxmut b{color:#E5E7EB}
.poc .pxrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.poc .pxcol{display:flex;flex-direction:column;gap:4px}
.poc .pxhb{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.16);background:#121933;color:#E5E7EB;font:600 12px system-ui,sans-serif;cursor:pointer;text-align:left}
.poc .pxhb:hover{border-color:rgba(255,255,255,.32)}
.poc .pxhb.pxgo,.poc .pxhb[aria-pressed=true]{background:#1E8FFF;border-color:#1E8FFF;color:#fff}
.poc .pxhb.pxdn{border-color:rgba(248,113,113,.5);color:#FCA5A5}
.poc .pxseg{display:flex;border:1px solid rgba(255,255,255,.16);border-radius:6px;overflow:hidden;margin-top:4px}
.poc .pxseg button{flex:1;padding:7px 4px;background:none;border:0;color:#C9CED8;font:600 12px system-ui,sans-serif;cursor:pointer}
.poc .pxseg button[aria-pressed=true]{background:#1E8FFF;color:#fff}
.poc label.pxl{display:block;margin:10px 0 2px;font-size:12px;color:#8A8A92}
.poc .pxguide{color:#C9CED8;font-size:12.5px;line-height:1.55}
.poc .pxguide b{color:#fff}
.poc kbd.k{display:inline-block;min-width:18px;text-align:center}
.poc .pxkv{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:12px}.poc .pxkv b{color:#E5E7EB;font-weight:600}
body.ax-poc-on #wrap{right:max(300px,min(360px,34vw))}

/* ---------- Tablet stage ---------- */
#wrap{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
#tab{width:1180px;height:820px;flex:none;border-radius:24px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 20px 60px rgba(16,24,40,.12);transform-origin:center center;display:flex;flex-direction:column}

/* header */
.hd{position:relative;z-index:10;height:88px;flex:none;padding:22px 40px 0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;color:inherit}
.logo{width:44px;height:44px;border-radius:12px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;line-height:1;padding-bottom:4px}
.brand b{display:block;font-size:17px;font-weight:700}
.brand small{display:block;margin-top:2px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--t4)}
.nav{display:flex;align-items:center;gap:8px;position:relative}
.pill{height:44px;padding:0 16px 0 14px;border-radius:22px;border:1px solid var(--bd2);background:#fff;color:var(--t1);font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.pill:hover{border-color:#C9CED6}
.pill[aria-expanded=true]{border-color:var(--a);background:var(--a08)}
.alerts{height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;color:var(--t2);font-size:15px;font-weight:500;cursor:default;border-radius:22px;position:relative}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#E6E8EC;color:var(--t1);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.alerts.pulse:after{content:"";position:absolute;inset:-2px;border-radius:24px;border:2px solid var(--a);animation:pl 1.4s ease-out infinite}
@keyframes pl{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.18)}}
.av{width:32px;height:32px;border-radius:16px;background:var(--t1);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.me{padding:0 12px 0 6px}
.gp .dot{width:8px;height:8px;border-radius:4px;background:var(--a)}
.gp.off .dot,.gp.paused .dot{background:var(--t5)}

/* body */
.bd{flex:1;min-height:0;padding:20px 40px 24px;display:flex;position:relative}
.aside{width:300px;flex:none;padding-right:28px;border-right:1px solid var(--bd);display:flex;flex-direction:column}
.cap{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--t4);text-transform:uppercase}
.prog{margin-top:6px;font-size:22px;font-weight:700}
.segs{margin-top:12px;display:flex;gap:4px}.segs span{flex:1;height:4px;border-radius:2px;background:var(--bd);transition:background .4s}
.steps{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.steps li{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:12px;transition:background .3s}
.steps li.cur{background:rgba(48,92,255,.07)}
.ring{width:22px;height:22px;flex:none;margin-top:1px;border-radius:11px;border:2px solid #C9CED6;background:#fff;display:flex;align-items:center;justify-content:center}
.cur .ring{border-color:var(--a)}.cur .ring:after{content:"";width:8px;height:8px;border-radius:4px;background:var(--a)}
.done .ring{border-color:var(--a);background:var(--a)}
.steps .l{display:block;font-size:15px;line-height:1.35;font-weight:500}
.steps .cur .l{font-weight:600}.steps .done .l{color:var(--t4)}
.steps .s{display:block;margin-top:2px;font-size:13px;color:var(--t4)}
.lnks{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start}
.tl{height:40px;padding:0 12px;border:0;background:none;color:var(--t3);font-size:14px;font-weight:500;border-radius:10px}
.tl:hover{background:#EEF0F3;color:var(--t1)}

.main{flex:1;min-width:0;padding-left:40px;display:flex;flex-direction:column;position:relative}
.date{font-size:14px;color:var(--t4)}
h1{margin:4px 0 0;font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.greet{margin:4px 0 0;font-size:16px;line-height:1.45;color:var(--t3)}
.donebar{height:36px;margin-top:8px;display:flex;align-items:center;gap:8px;font-size:14px}
.donebar .nx{color:var(--t4)}
.undo{margin-left:auto;height:36px;padding:0 8px;border:0;background:none;color:var(--t2);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.card{background:#fff;border:1px solid var(--bd);border-radius:20px;box-shadow:0 1px 2px rgba(16,24,40,.04);padding:26px 30px}
.card.anim{animation:cin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes cin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ctop{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.tag{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--t2)}
.tag.urg{color:var(--red2)}.tag.urg:before{content:"";width:8px;height:8px;border-radius:4px;background:var(--red)}
.stp{color:var(--t4)}
.card h2{margin:16px 0 0;font-size:24px;line-height:1.3;font-weight:600}
.card p{margin:6px 0 0;font-size:16px;line-height:1.5;color:var(--t3)}
.draft{margin-top:16px;background:var(--bg);border-radius:12px;padding:12px 16px}
.draft div{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--t4)}
.draft p{margin:4px 0 0!important;font-size:15px!important;color:var(--t1)!important}
.acts{margin-top:24px;display:flex;align-items:center;gap:4px}
.pri{height:48px;padding:0 24px;border:0;border-radius:12px;background:var(--a);color:#fff;font-size:16px;font-weight:600;margin-right:8px}
.pri:hover{background:#2449D8}
.sec{height:44px;padding:0 12px;border:0;background:none;color:var(--t3);font-size:15px;font-weight:500;border-radius:10px}
.sec:hover{background:#EEF0F3;color:var(--t1)}
.sepd{color:#C2C7D0}
.clr{display:flex;align-items:flex-start;gap:16px}
.ck{width:48px;height:48px;flex:none;border-radius:24px;background:var(--a08);display:flex;align-items:center;justify-content:center}
.clr h2{margin:0}.clr p{margin-top:4px}
.shh{margin-top:22px;display:flex;align-items:baseline;gap:8px}.shh b{font-size:14px}.shh span{font-size:13px;color:var(--t4)}
.shl{margin-top:8px;display:flex;flex-direction:column}
.shb{min-height:60px;padding:10px 4px;border:0;border-top:1px solid #EEF0F3;background:none;text-align:left;display:flex;align-items:center;gap:12px;border-radius:0}
.shb:hover{background:#FAFBFC}
.shb .x{flex:1;display:flex;flex-direction:column;gap:2px}.shb .x b{font-size:16px;font-weight:600}.shb .x small{font-size:13px;color:var(--t4)}
.shb .o{font-size:14px;font-weight:600;color:var(--a)}

/* ask field */
.askw{margin-top:auto;position:relative}
.ask{height:60px;border-radius:30px;background:#fff;border:1px solid var(--bd3);display:flex;align-items:center;gap:10px;padding:0 8px 0 20px;transition:border-color .15s,box-shadow .15s}
.ask:focus-within{border-color:var(--a);box-shadow:0 0 0 4px var(--a08)}
.ask.lis{border:2px solid var(--a)}
.ask input{flex:1;min-width:0;height:44px;border:0;outline:0;background:none;font-family:inherit;font-size:16px;color:var(--t1)}
.speak{height:44px;padding:0 16px 0 12px;border-radius:22px;border:0;background:var(--a08);color:var(--a);font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.speak.on{background:var(--a);color:#fff}
.askbtn{height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--a);color:#fff;font-size:15px;font-weight:600}
.tip{position:absolute;right:0;bottom:70px;background:var(--t1);color:#fff;font-size:13px;border-radius:10px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(16,24,40,.18);animation:cin .3s}
.tip button{height:32px;padding:0 10px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:600}
.tip:after{content:"";position:absolute;right:40px;bottom:-5px;width:10px;height:10px;background:var(--t1);transform:rotate(45deg)}

/* voice panel (waveform from AX_GANES_Chat_Menus_POC) */
.vx{position:absolute;left:40px;right:0;top:108px;bottom:76px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:vxin .3s ease-out;z-index:4;
  --vw1:rgba(31,111,229,.85);--vw2:rgba(20,70,190,1);--vwf:rgba(31,111,229,.08);--vws:rgba(31,111,229,.55)}
@keyframes vxin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.vx-say{max-width:560px;min-height:3.4em;display:grid;place-items:center;font-size:26px;line-height:1.35;color:var(--t1)}
.vx-say.dim{font-size:16px;color:var(--t4)}
.vx-cv{display:block;width:560px;height:120px;margin-top:10px}
.vx-src{margin-top:4px;font-size:12px;color:var(--t4)}
.vx-ctl{display:flex;gap:10px;margin-top:14px}
.vbtn{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--bd3);background:#fff;color:var(--t2);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.vbtn.p{background:var(--a);border-color:var(--a);color:#fff}
.vbtn:disabled{opacity:.4;cursor:default}

/* gesture panel + confirm bar (from Gesture.dc.html) */
.gpan{position:absolute;top:84px;right:40px;width:310px;background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:0 16px 40px rgba(16,24,40,.14);padding:14px 14px 10px;z-index:20;animation:cin .25s}
.gpan .h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.gpan .h b{font-size:15px}.gpan .h span{font-size:12px;color:var(--t4);display:flex;align-items:center;gap:6px}
.gpan .h span i{width:8px;height:8px;border-radius:4px;background:var(--a)}
.chip{width:100%;position:relative;overflow:hidden;min-height:56px;margin-top:4px;padding:6px 8px;border-radius:12px;border:1px solid var(--bd);background:#fff;text-align:left;display:flex;align-items:center;gap:10px;user-select:none;-webkit-user-select:none;touch-action:none}
.chip.on{border-color:var(--a);background:var(--a08)}
.chip .x{display:flex;flex-direction:column;gap:1px;flex:1}.chip .x b{font-size:14px;font-weight:600}.chip .x small{font-size:12px;color:var(--t4)}
.chip kbd{font:600 11px/18px 'Plus Jakarta Sans';padding:0 6px;border:1px solid var(--bd3);border-radius:5px;color:var(--t4)}
.chip .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--a);width:0}
.gpan .f{margin-top:6px;padding:4px 4px 0;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--t4)}
.gpan .f button{height:36px;padding:0 6px;border:0;background:none;color:var(--t3);font-size:13px;font-weight:600}
.cam{margin-top:8px;border-radius:10px;overflow:hidden;background:#0B1020;position:relative;height:120px}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam span{position:absolute;left:8px;bottom:6px;font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px}
.gbar{position:absolute;left:490px;bottom:100px;width:540px;overflow:hidden;background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:0 16px 40px rgba(16,24,40,.16);padding:12px 12px 14px 14px;display:flex;align-items:center;gap:12px;z-index:21;animation:cin .2s}
.gbar .ic{width:48px;height:48px;flex:none;border-radius:24px;background:var(--a08);display:flex;align-items:center;justify-content:center}
.gbar .ic.g{background:#F2F4F7}
.gbar .x{flex:1;display:flex;flex-direction:column;gap:2px}.gbar .x b{font-size:16px}.gbar .x small{font-size:13px;color:var(--t4)}
.gbar .cn{height:44px;padding:0 18px;border-radius:12px;border:1px solid #D0D5DD;background:#fff;font-size:15px;font-weight:600}
.gbar .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--a)}

/* dropdown: profile */
.dd{position:absolute;top:52px;right:0;width:300px;background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:0 16px 40px rgba(16,24,40,.14);padding:8px;z-index:30;animation:cin .2s}
.dd .who{display:flex;align-items:center;gap:12px;padding:10px 10px 12px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.dd .who b{display:block;font-size:15px}.dd .who small{display:block;font-size:12.5px;color:var(--t4)}
.dd .av{width:40px;height:40px;border-radius:20px;font-size:15px}
.di{width:100%;min-height:44px;padding:8px 10px;border:0;background:none;border-radius:10px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--t1);font-size:14.5px;font-weight:500}
.di:hover{background:var(--bg)}
.di svg{color:var(--t4);flex:none}
.di small{margin-left:auto;font-size:11.5px;color:var(--t5);font-weight:500}
.dh{margin:10px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--t4)}
.dsep{height:1px;background:var(--bd);margin:6px 2px}

/* All menus sheet */
.scrim{position:absolute;inset:0;background:rgba(16,24,40,.28);z-index:40;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.sheet{position:absolute;left:50%;top:50%;width:820px;max-height:720px;transform:translate(-50%,-50%);background:#fff;border-radius:24px;box-shadow:0 24px 60px rgba(16,24,40,.22);z-index:41;display:flex;flex-direction:column;animation:shin .55s cubic-bezier(.16,1,.3,1)}
@keyframes shin{from{opacity:0;transform:translate(-50%,40%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}
.sh{padding:24px 28px 0;display:flex;align-items:flex-start;gap:16px}
.sh h3{margin:0;font-size:22px}.sh p{margin:4px 0 0;font-size:14px;color:var(--t4)}
.sh .sp{flex:1}
.close{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--bd2);background:#fff;font-size:14px;font-weight:600;color:var(--t2)}
.msrch{margin:16px 28px 0;height:44px;border:1px solid var(--bd3);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 14px}
.msrch:focus-within{border-color:var(--a)}
.msrch input{flex:1;border:0;outline:0;font-family:inherit;font-size:15px}
.sb{overflow:auto;padding:4px 28px 8px}
.ms{margin-top:18px}
.ms h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--t4);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.ms h4:after{content:"";flex:1;height:1px;background:var(--bd)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mi{min-height:76px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:#fff;display:flex;align-items:flex-start;gap:12px;text-align:left;animation:miIn .5s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(.12s + var(--i,0)*40ms)}
@keyframes miIn{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.mi:hover{border-color:var(--a);box-shadow:0 4px 14px rgba(48,92,255,.08)}
.mi .ti{width:40px;height:40px;flex:none;border-radius:12px;background:var(--a08);color:var(--a);display:flex;align-items:center;justify-content:center}
.mi .x{min-width:0}.mi b{display:block;font-size:15px;font-weight:600;color:var(--t1)}.mi small{display:block;margin-top:2px;font-size:12.5px;line-height:1.4;color:var(--t4)}
.mi .tbd{display:inline-block;margin-left:4px;font-size:10.5px;font-weight:700;color:var(--t4);background:#F2F4F7;border-radius:6px;padding:1px 5px;vertical-align:2px}
.sf{margin:12px 28px 24px;padding:12px 14px;border-radius:14px;background:var(--bg);display:flex;align-items:center;gap:12px;font-size:14px;color:var(--t3)}
.sf svg{color:var(--t4);flex:none}.sf b{color:var(--t1)}
.sf .sp{flex:1}
.ghost{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--bd3);background:#fff;font-size:14px;font-weight:600;color:var(--t1);white-space:nowrap}
.empty{padding:30px 0;text-align:center;color:var(--t4);font-size:14px}

/* Settings (layout from POC Profile) */
.pg{flex:1;min-height:0;padding:12px 40px 24px;display:flex;flex-direction:column}
.back{align-self:flex-start;height:36px;padding:0 12px 0 8px;border:0;background:none;border-radius:10px;font-size:14px;font-weight:600;color:var(--t3);display:flex;align-items:center;gap:4px}
.back:hover{background:#EEF0F3;color:var(--t1)}
.pgh{margin:8px 0 14px}.pgh h2{margin:0;font-size:24px}.pgh p{margin:4px 0 0;font-size:14px;color:var(--t4)}
.pfg{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
.pnl{background:#fff;border:1px solid var(--bd);border-radius:20px;min-height:0}
.pfl{padding:22px;display:flex;flex-direction:column;gap:14px}
.pfa{width:72px;height:72px;border-radius:36px;background:var(--t1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600}
.pfl h3{margin:0;font-size:20px}.pfl .w small{display:block;margin-top:2px;font-size:13px;color:var(--t4)}
.pfk{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--bd)}
.pfk div{display:flex;justify-content:space-between;font-size:13px;color:var(--t4)}.pfk b{color:var(--t1);font-weight:600}
.qb{height:6px;border-radius:3px;background:var(--bd);overflow:hidden}.qb i{display:block;height:100%;background:var(--a)}
.pfo{margin-top:auto}
.out{height:44px;width:100%;border-radius:12px;border:1px solid #F4C7C3;background:#fff;color:var(--red2);font-size:14px;font-weight:600}
.svp{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:4px;padding:12px 12px 0;border-bottom:1px solid var(--bd);overflow-x:auto}
.tabs button{height:40px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;font-size:14px;font-weight:600;color:var(--t4);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--a);border-bottom-color:var(--a)}
.tc{flex:1;overflow:auto;padding:4px 0 12px}
.sh2{margin:16px 20px 2px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--t4);text-transform:uppercase}
.r2{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid var(--bd)}
.r2 b{display:block;font-size:14.5px;font-weight:600}.r2 small{display:block;margin-top:2px;font-size:12.5px;line-height:1.45;color:var(--t4);max-width:520px}
.sw{width:44px;height:26px;flex:none;border-radius:13px;border:0;background:#D0D5DD;position:relative;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.sw[aria-checked=true]{background:var(--a)}.sw[aria-checked=true]:after{left:21px}
.sw:disabled{opacity:.5;cursor:default}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;flex:none}
.seg button{height:32px;padding:0 12px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--t4)}
.seg button[aria-pressed=true]{background:#fff;color:var(--t1);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.poses{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 20px 4px}
.pose{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--bd);border-radius:12px}
.pose b{display:block;font-size:13.5px}.pose small{display:block;font-size:12px;color:var(--t4)}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;padding:4px 20px}
.ff label{display:block;margin-top:14px;font-size:13px;font-weight:600;color:var(--t2)}
.ff input,.ff select{width:100%;height:44px;margin-top:6px;padding:0 12px;border:1px solid var(--bd3);border-radius:10px;font-family:inherit;font-size:14.5px;color:var(--t1);background:#fff}
.ff input[readonly]{background:var(--bg);color:var(--t4)}
.ff small{display:block;margin-top:4px;font-size:12px;color:var(--t4)}
.note{margin:16px 20px;padding:14px 16px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.5;color:var(--t3)}
.badge2{display:inline-block;font-size:11px;font-weight:700;background:var(--a08);color:var(--a);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}

/* AI room (from POC) */
.ai{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:860px;margin:0 auto;padding:4px 40px 24px}
.aih{display:flex;align-items:center;gap:12px;padding:6px 0 12px;border-bottom:1px solid var(--bd)}
.aih .back{margin-right:4px}
.aiav{width:40px;height:40px;flex:none;border-radius:12px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;padding-bottom:2px}
.aiav.sm{width:34px;height:34px;font-size:16px;border-radius:10px}
.aih b{display:block;font-size:16px}.aih small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t4)}
.aih small i{width:8px;height:8px;border-radius:4px;background:#12B76A}
.ail{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:16px 2px}
.aiu{align-self:flex-end;max-width:70%;padding:12px 16px;border-radius:16px 16px 4px 16px;background:var(--a);color:#fff;font-size:15px;line-height:1.5;animation:cin .25s}
.aiu small{display:block;margin-top:4px;text-align:right;font-size:11px;opacity:.85}
.aia{display:flex;align-items:flex-start;gap:12px;max-width:88%;animation:cin .3s}
.aic{min-width:0;padding:16px 18px;border:1px solid var(--bd);border-radius:4px 16px 16px 16px;background:#fff}
.aic h4{margin:0 0 6px;font-size:17px}
.aic p{margin:0;font-size:15px;line-height:1.55;color:var(--t2);white-space:pre-line}
.aic .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ab{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--bd3);background:#fff;font-size:14px;font-weight:600;color:var(--t1)}
.ab.p{background:var(--a);border-color:var(--a);color:#fff}
.aic time{display:block;margin-top:10px;font-size:11px;color:var(--t5)}
.aid{display:flex;gap:5px;padding:6px 2px}.aid i{width:7px;height:7px;border-radius:50%;background:var(--t5);animation:aidp 1s infinite}.aid i:nth-child(2){animation-delay:.15s}.aid i:nth-child(3){animation-delay:.3s}
@keyframes aidp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.ai .vx{left:40px;right:40px;top:70px}

/* toast */
.toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);width:520px;text-align:center;background:var(--t1);color:#fff;font-size:14px;line-height:1.4;padding:12px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,.18);z-index:60;animation:cin .25s}
/* gesture panel in the task list column (storyboard frames 1–6) */
.gs{margin-top:auto;border-top:1px solid var(--bd);padding-top:14px;display:flex;flex-direction:column}
.gs .st{display:flex;align-items:center;gap:8px}
.gs .st i{width:8px;height:8px;flex:none;border-radius:4px;background:var(--a)}
.gs .st i.g{background:var(--t5)}
.gs .st b{font-size:14px;font-weight:600;flex:1}
.gs .st button{height:32px;padding:0 4px;border:0;background:none;color:var(--t3);font-size:13px;font-weight:600}
.gs .sub{margin:2px 0 0 16px;font-size:12px;color:var(--t4)}
.gs .chs{margin-top:10px;display:flex;flex-direction:column;gap:6px;transition:opacity .2s}
.gs .chs.dim{opacity:.4;pointer-events:none}
.gs .chip{margin-top:0;min-height:48px;padding:0 10px 0 6px;gap:8px}
.gs .chip .x{flex-direction:row;align-items:center;justify-content:space-between}
.gs .chip .x b{font-size:14px}.gs .chip .x small{font-size:12px}
.gs .hnt{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t4)}
.gs .on{margin-top:12px;height:44px;border-radius:12px;border:1px solid #D0D5DD;background:#fff;color:var(--t1);font-size:14px;font-weight:600}
.gs .camt{margin-top:8px;height:72px;border-radius:10px;overflow:hidden;background:#0B1020;position:relative}
.gs .camt video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.gs .camt span{position:absolute;left:6px;bottom:4px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:6px}
.lnks.inl{margin-top:4px;flex-direction:row;align-items:center}
.ask.typ{border:2px solid var(--a)}
/* Gesture Shortcuts setup wizard */
.wz{position:absolute;left:50%;top:50%;width:720px;transform:translate(-50%,-50%);background:#fff;border-radius:24px;box-shadow:0 24px 60px rgba(16,24,40,.22);z-index:41;padding:26px 30px 24px;animation:cin .3s}
.wz .wh{display:flex;align-items:flex-start;justify-content:space-between}
.wz h3{margin:0;font-size:22px}.wz .wh p{margin:4px 0 0;font-size:14px;color:var(--t4)}
.wz ol{list-style:none;display:flex;gap:6px;margin:18px 0 0;padding:0}
.wz ol li{flex:1;font-size:12.5px;font-weight:600;color:var(--t5)}
.wz ol li:before{content:"";display:block;height:4px;border-radius:2px;background:var(--bd);margin-bottom:6px}
.wz ol li.on{color:var(--t1)}.wz ol li.on:before{background:var(--a)}
.wz .wb{margin-top:20px;min-height:250px}
.wz .wf{margin-top:20px;display:flex;align-items:center;gap:8px}
.wz .wf .sp{flex:1}
.camb{height:200px;border-radius:16px;background:#0B1020;color:#C9CED8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;overflow:hidden;position:relative}
.camb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.chk{display:flex;gap:18px;margin-top:12px;font-size:14px;color:var(--t2)}
.chk span{display:flex;align-items:center;gap:6px}
.maprow{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--bd)}
.maprow b{display:block;font-size:15px}.maprow small{display:block;font-size:12.5px;color:var(--t4)}
.maprow .x{flex:1}
.maprow select{height:44px;min-width:260px;border:1px solid var(--bd3);border-radius:10px;padding:0 10px;font-family:inherit;font-size:14.5px;background:#fff}
.blk{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--bg);font-size:13px;color:var(--t3);display:flex;gap:8px;align-items:center}
.prc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prc .chip{min-height:72px}
.prc .ok{color:#067647;font-weight:600;font-size:13px}
/* v2.5 guided task (to-do → next, next, done) */
.gt{flex:1;min-height:0;background:var(--bg);display:flex;flex-direction:column;animation:cin .3s}
.gt-top{flex:none;padding:8px 40px 0;display:flex;align-items:flex-start;gap:20px}
.gt-top .x{flex:1}.gt-top small{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--t4);text-transform:uppercase}
.gt-top b{display:block;margin-top:4px;font-size:20px;font-weight:700}
.gt-segs{display:flex;gap:4px;margin-top:12px}.gt-segs span{flex:1;height:4px;border-radius:2px;background:var(--bd);transition:background .3s}.gt-segs span.on{background:var(--a)}
.gt-body{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:34px 40px 28px;overflow:hidden}
.gt-stack{position:relative;width:640px;max-width:100%}
.gt-paper{position:absolute;left:0;right:0;top:0;height:100%;background:#fff;border:1px solid var(--bd);border-radius:20px;box-shadow:0 1px 2px rgba(16,24,40,.04);pointer-events:none}
.gt-paper.p1{transform:translateY(-30px) scale(.97);z-index:1}
.gt-paper.p2{transform:translateY(-56px) scale(.94) rotate(-1.4deg);z-index:0}
.gt-paper span{position:absolute;left:24px;top:8px;font-size:11.5px;font-weight:600;color:var(--t4);display:flex;align-items:center;gap:6px}
.gt-paper span:before{content:"";width:7px;height:7px;border-radius:4px;background:#C9CED6}
.gt-stack .gt-card{position:relative;z-index:2;width:100%;box-shadow:0 12px 32px rgba(16,24,40,.10)}
.gt-card.in{animation:gtin .38s cubic-bezier(.2,.8,.2,1)}
.gt-card.back{animation:gtback .38s cubic-bezier(.2,.8,.2,1)}
@keyframes gtin{from{opacity:0;transform:translateY(-18px) scale(.965)}to{opacity:1;transform:none}}
@keyframes gtback{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
.gt-foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--t4)}
.gt-foot .sp{flex:1}
.gt-foot .pri{height:44px;margin:0;font-size:15px}
.gt-foot .pri:disabled{opacity:.4;cursor:default}
.gt-prev{position:absolute;left:-24px;top:50%;transform:translateY(-50%);width:210px;height:62%;min-height:260px;background:#fff;border:1px solid var(--bd);border-radius:20px;box-shadow:0 1px 2px rgba(16,24,40,.04);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px 22px 24px 46px;text-align:left;font-family:inherit;color:var(--t1);transition:transform .2s,box-shadow .2s}
.gt-prev:hover{transform:translateY(-50%) translateX(6px);box-shadow:0 8px 24px rgba(16,24,40,.10)}
.gt-prev .ar{width:44px;height:44px;border-radius:22px;background:var(--a08);color:var(--a);display:flex;align-items:center;justify-content:center}
.gt-prev b{font-size:18px;line-height:1.25}.gt-prev small{font-size:13px;color:var(--t4);line-height:1.4}
.gt-card{width:640px;max-width:100%;align-self:flex-start;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:30px 32px;animation:cin .3s}
.gt-card h2{margin:0;font-size:24px;line-height:1.3}.gt-card>p{margin:6px 0 0;font-size:16px;line-height:1.5;color:var(--t3)}
.gt-f{margin-top:22px}
.gt-f label{display:block;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:6px}
.gt-in{display:flex;align-items:center;gap:8px;border:1px solid var(--bd3);border-radius:14px;padding:0 6px 0 14px;background:#fff}
.gt-in:focus-within{border-color:var(--a);box-shadow:0 0 0 4px var(--a08)}
.gt-in input,.gt-in textarea{flex:1;min-width:0;border:0;outline:0;font-family:inherit;font-size:16px;color:var(--t1);background:none;padding:13px 0}
.gt-in textarea{min-height:96px;resize:vertical;line-height:1.5}
.gt-in .speak{height:38px;padding:0 12px 0 10px;font-size:14px;align-self:center}
.gt-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gt-ch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.gt-ch button{min-height:84px;padding:14px 16px;border:1px solid var(--bd);border-radius:16px;background:#fff;text-align:left;display:flex;gap:12px;align-items:flex-start;font-family:inherit}
.gt-ch button:hover{border-color:#C9CED6}.gt-ch button[aria-pressed=true]{border-color:var(--a);background:var(--a08)}
.gt-ch .ti{width:40px;height:40px;flex:none;border-radius:12px;background:var(--a08);color:var(--a);display:flex;align-items:center;justify-content:center}
.gt-ch b{display:block;font-size:15.5px;color:var(--t1)}.gt-ch small{display:block;margin-top:2px;font-size:13px;color:var(--t4);line-height:1.4}
.gt-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.gt-chips button{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--bd3);background:#fff;font-size:14.5px;font-weight:500;color:var(--t2)}
.gt-chips button[aria-pressed=true]{border-color:var(--a);background:var(--a08);color:var(--a);font-weight:600}
.gt-drop{margin-top:22px;border:1.5px dashed #C9CED6;border-radius:16px;padding:26px;text-align:center;color:var(--t3);font-size:14.5px}
.gt-drop b{display:block;color:var(--t1);font-size:16px;margin:8px 0 2px}
.gt-drop .acts{justify-content:center;margin-top:14px}
.gt-file{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.gt-file div{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;font-size:14.5px}
.gt-file div span{flex:1}.gt-file em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--t4)}
.gt-file em.ok{color:#067647}.gt-file em.bad{color:var(--red2)}
.gt-prog{margin-top:26px}.gt-prog .bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.gt-prog .bar i{display:block;height:100%;background:var(--a);transition:width .2s}
.gt-prog p{margin:10px 0 0;font-size:14px;color:var(--t3)}
.gt-kv{margin-top:20px;border-top:1px solid var(--bd)}.gt-kv div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--bd);font-size:15px}.gt-kv span{color:var(--t4)}.gt-kv b{text-align:right}
.gt-ok{display:flex;align-items:center;gap:14px;margin-top:4px}
.gt-ok .ck{width:52px;height:52px}
.gt-note{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;color:var(--t3);line-height:1.5}
.gt-code{margin-top:18px;padding:14px;border-radius:12px;background:#0B1020;color:#C9D4FF;font:13px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.gt-list{margin:18px 0 0;padding:0;list-style:none}.gt-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:15px;color:var(--t2)}
.gt-list li i{width:22px;height:22px;flex:none;border-radius:11px;border:2px solid #C9CED6;margin-top:1px}.gt-list li.ok i{border-color:#067647;background:#067647}.gt-list li.no i{border-color:var(--red);background:var(--red)}
.gt-bot{display:none}
.gt-bot .sp{flex:1}
.gt-bot .pri{margin-right:0}
.gt-bot .pri:disabled{opacity:.4;cursor:default}
body.shot{background:#F6F7F9}body.shot #wrap{position:static}body.shot #tab{transform:none!important;border-radius:0;box-shadow:none}
</style>
</head>
<body>

<button class="pocb" id="pocBtn" type="button" title="POC tools (`)"><span class="pxrl">Owner</span>POC tools <kbd>`</kbd></button>
<aside class="poc" id="poc" aria-label="POC tools">
  <header><div><b>POC tools</b><i>v2.9 · Home</i></div><button id="pocX" aria-label="Close POC tools">×</button></header>
  <div class="pxbd">
    <div class="pxpn"><h3>Scenario</h3><div class="pxcol" id="scs"></div></div>
    <div class="pxpn"><h3>Guide</h3><div class="pxguide" id="hint"></div></div>
    <div class="pxpn" id="gtools"><h3>Gesture frames (storyboard)</h3>
      <div class="pxrow" id="gfr"></div>
      <label class="pxl">Play flow</label>
      <div class="pxrow"><button class="pxhb pxgo" data-flow="A">A · Hands busy (V sign)</button><button class="pxhb" data-flow="B">B · Cashier (thumb → fist)</button><button class="pxhb" data-flow="C">C · Restock (one finger)</button></div>
      <label class="pxl">Simulate</label>
      <div class="pxrow"><button class="pxhb" id="gAway">No hand for 60 s</button><button class="pxhb" id="gTab">Tab not active</button><button class="pxhb" id="gSetup">Run setup (2 min)</button></div>
      <div class="pxmut" style="margin-top:8px">Keys: hold <kbd class="k">V</kbd> V sign · <kbd class="k">U</kbd> thumb up · <kbd class="k">O</kbd> one finger · <kbd class="k">F</kbd> fist</div>
    </div>
    <div class="pxpn"><h3>Options</h3>
      <label class="pxl">Time of day</label><div class="pxseg" id="oTime"><button data-v="morning">Morning</button><button data-v="evening">Evening</button></div>
      <label class="pxl">Voice input</label><div class="pxseg" id="oVoice"><button data-v="sim">Simulated</button><button data-v="real">Real microphone</button></div>
      <label class="pxl">Gesture input</label><div class="pxseg" id="oCam"><button data-v="sim">Keys / chips</button><button data-v="real">Real camera</button></div>
    </div>
    <div class="pxpn"><h3>Self-test</h3><div class="pxmut">Runs every flow through the real engine and pages, then restores your data.</div>
      <div class="pxrow"><button class="pxhb pxgo" id="bSelf" type="button">Run self-test</button></div><div class="pxmut" id="stSum" style="margin-top:8px;font-weight:600"></div><div id="stList" style="max-height:260px;overflow:auto;margin-top:6px;font-size:12px;line-height:1.5"></div></div>
    <div class="pxpn"><h3>Navigation</h3><div class="pxrow"><button class="pxhb" id="btnReset">Reset scenario</button><button class="pxhb" id="bFs">Full screen</button><button class="pxhb pxdn" id="btnAll">Reset prototype</button></div></div>
  </div>
</aside>

function setScenario(n){
  if(typeof W!=='undefined'&&W){clearInterval(wT);W=null}

  const ret=()=>{S.mode='tasks';S.queue=[0,1,2];S.done=[]};
  if(n===1){S.tipSeen=false;S.tip=true}

  if(n===3){ret();S.g.on=true;S.g.setup=true;S.g.mode='idle';S.tip=false;S.tipSeen=true;gArmAutoOff()}

  if(n===5){ret();S.tip=!keepTip}
  if(n===6){ret();S.menus=true}

  if(n===8){ret();S.view='settings';S.setTab='info'}
  if(n===9){ret();later(80,()=>{const i=$('#askIn');if(i)i.focus()})}
  if(n!==1&&n!==5)S.tip=false;
  if(S.g.on&&OPT.cam==='real')camStart();
  render();
}

/* ---------- task logic (Option C) ---------- */
function list(){return S.mode==='setup'?SETUP:TASKS}
function curTask(){
  if(!S.queue.length)return null;
  const i=S.queue[0];let t=list()[i];
  if(S.mode==='setup'&&S.sub)t=Object.assign({},t,SUBS[S.sub]);
  return t;
}
function complete(){
  if(!S.queue.length)return;
  const idx=S.queue[0];
  /* new owner: show the intermediate states from the storyboard once */
  if(S.mode==='setup'&&!S.sub){
    const sub={1:'failed',2:'result',3:'waiting'}[idx];
    if(sub&&!S.subUsed[sub]){S.subUsed[sub]=1;S.sub=sub;S.last=null;
      if(sub==='waiting')say('Embed code copied from Chatbot Settings › Appearance.');
      render();return}
  }
  const t=curTask();S.sub=null;
  S.queue.shift();S.done.push(idx);
  const stamp=Date.now();S.last={idx,stamp,msg:t.done};
  later(5000,()=>{if(S.last&&S.last.stamp===stamp){S.last=null;render()}});
  render();
}
function alt(){
  const t=curTask();if(!t)return;
  if(S.sub==='failed'||S.sub==='result'){const m=t.altMsg;S.sub=null;const idx=S.queue.shift();S.done.push(idx);S.last={idx,stamp:Date.now(),msg:list()[idx].done};say(m);return}
  say(t.altMsg);
}
function undo(){
  const l=S.last;if(!l)return;
  S.queue.unshift(l.idx);S.done=S.done.filter(d=>d!==l.idx);S.last=null;render();
}
function pushLater(){
  if(S.queue.length<2)return;S.sub=null;S.queue.push(S.queue.shift());S.last=null;say('Moved to later. It’s now the last task today.');
}

/* ---------- render ---------- */
function render(){
  const tab=$('#tab');
  const ae=document.activeElement, focusId=ae&&ae.id, selS=ae&&ae.selectionStart;
  tab.innerHTML=header()+(W?guided():S.view==='home'?home():S.view==='ai'?aiRoom():settings())
    +(S.menus?menusSheet():'')+(S.wiz?wizard():'')+gestureBar()+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'');
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();if(selS!=null&&el.setSelectionRange)try{el.setSelectionRange(selS,selS)}catch(e){}}}
  if(S.voice)vxMount();
  if(S.view==='ai'){const l=$('#ail');if(l)l.scrollTop=l.scrollHeight}
  const v=$('#camv');if(v&&camStream&&v.srcObject!==camStream){v.srcObject=camStream;v.play().catch(()=>{})}
  pocSync();
  const wv=$('#wzv');if(wv&&camStream&&wv.srcObject!==camStream){wv.srcObject=camStream;wv.play().catch(()=>{})}
}

function home(){
  const isSetup=S.mode==='setup', L=list(), cur=curTask(), total=L.length, doneN=S.done.length, left=S.queue.length;
  const showG=!isSetup&&S.g.on;
  let hello,line;
  if(isSetup){hello='Welcome, Andi · Gelora Sport.';line=left?`${left} ${left===1?'step':'steps'} until your chatbot is live.`:'Your chatbot is live.'}
  else{hello=S.time==='evening'?'Good evening, Andi.':'Good morning, Andi.';line=left===0?'All clear for today.':left===1?'1 thing needs you today. I’ve prepared it.':`${left} things need you today. I’ve prepared each one.`}
  const ordered=S.done.concat(S.queue);
  const steps=ordered.map((idx,pos)=>{const t=L[idx],st=pos<doneN?'done':pos===doneN?'cur':'todo';
    return`<li class="${st}"><span class="ring" aria-hidden="true">${st==='done'?`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">${P.check}</svg>`:''}</span><span><span class="l">${t.short}</span><span class="s">${st==='done'?'Done':st==='cur'?'Now':'Up next'} · ${t.source}</span></span></li>`}).join('');
  const segs=Array.from({length:total},(_,i)=>`<span style="background:${i<doneN?A:(i===doneN&&left?'rgba(48,92,255,.3)':'#E6E8EC')}"></span>`).join('');

const OPT={voice:'sim',cam:'sim'};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

const SIM_Q='How many Jersey Tim Custom are left?';
function vxHtml(){
  const v=S.voice;

   </div></div>`;
}
function vxOpen(src){
  S.tip=false;S.tipSeen=true;S.menus=false;S.prof=false;

  render();vListen();
}
function vxMount(){cancelAnimationFrame(vRaf);vRaf=requestAnimationFrame(vLoop)}
function vxClose(silent){
  vGen++;if(vRec){try{vRec.abort()}catch(e){}vRec=null}
  if(vStream)vStream.getTracks().forEach(t=>t.stop());if(vAC)vAC.close().catch(()=>{});vStream=vAC=vAn=vBuf=null;

function vText(t,dim){if(!S.voice)return;S.voice.text=t;S.voice.dim=!!dim;const e=$('#vxsay');if(e){e.textContent=t;e.classList.toggle('dim',!!dim)}}

function vMic(){if(!vAn)return 0;vAn.getByteTimeDomainData(vBuf);let q=0;for(const x of vBuf){const d=(x-128)/128;q+=d*d}return Math.min(1,Math.sqrt(q/vBuf.length)*5)}

  if(!S.voice)return;

  S.voice.idle=false;vText('What can I help you with?');render();
  const real=OPT.voice==='real'&&SR;
  if(!real){ /* simulated speech: words appear as if spoken */
    const words=SIM_Q.split(' ');let i=0;
    const step=()=>{if(g!==vGen||!S.voice)return;i++;vTgt=.75;vText(words.slice(0,i).join(' '));if(i<words.length)later(260,step);else later(900,()=>{if(g===vGen&&S.voice)vFinish(SIM_Q)})};
    later(1100,step);return;
  }

    vText(err==='not-allowed'||err==='service-not-allowed'?'Microphone permission was blocked. Allow it in the browser, then try again.':err&&err!=='no-speech'&&err!=='aborted'?'The microphone can’t be reached. Try again.':'No voice heard. Try again.',true)};

function vFinish(t){vxClose(true);aiSend(t,true)}
function vLoop(ts){
  if(!S.voice)return;vRaf=requestAnimationFrame(vLoop);

function vDraw(t){

  c.lineWidth=1;c.strokeStyle=g;c.globalAlpha=.55;c.beginPath();c.moveTo(0,mid);c.lineTo(cw,mid);c.stroke();
  for(let k=0;k<5;k++){

    for(let x=0;x<=cw;x+=4){const n=x/cw,env=Math.exp(-Math.pow((n-.5)*3.4,2));pts.push([x,Math.sin(n*fr*3.1416+phs)*env*a])}

    c.globalAlpha=.95-k*.14;c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,mid-y):c.moveTo(x,mid-y));c.stroke();
    c.globalAlpha=.3-k*.04;c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,mid+y*.45):c.moveTo(x,mid+y*.45));c.stroke();
  }
  c.globalAlpha=1;c.shadowBlur=0;
}

function gPress(pose){
  const g=S.g;if(!g.on||S.view!=='home'||S.mode!=='tasks')return;gLive();

  gStop();g.mode='hold';g.pose=pose;g.p=0;render();gArmAutoOff();
  holdI=setInterval(()=>{g.p+=40/800;if(g.p>=1){clearInterval(holdI);gConfirm(pose)}else gPaint()},40);
}
function gRelease(){const g=S.g;if(g.mode!=='hold'||g.frozen)return;gStop();g.mode='idle';g.pose=null;g.p=0;render()}
function gConfirm(pose){
  const g=S.g;g.mode='confirm';g.p=1;g.cp=0;render();
  confI=setInterval(()=>{g.cp+=40/1000;if(g.cp>=1){clearInterval(confI);gRun(pose)}else gPaint()},40);
}
function gRun(pose){
  const g=S.g;
  if(S.g.map[pose]==='voice'){gListen();return}
  g.mode='idle';g.pose=null;g.p=0;g.cp=0;say('Opens '+gTarget(pose)+'.');if(!g.frozen)later(900,()=>goPage(gTarget(pose)));
}

function gListen(){
  const g=S.g;g.mode='listen';g.pose=null;g.p=0;g.cp=0;S.query='';render();
  const Q='How many Jersey Tim Custom are left?';
  const done=t=>{if(S.g.mode!=='listen')return;S.query=t;render();later(700,()=>{if(S.g.mode!=='listen')return;S.g.mode='idle';S.query='';say('Ganes: Jersey Tim Custom has 3 left. It’s on your low-stock list.',4500);gArmAutoOff()})};
  if(OPT.voice==='real'&&SR){
    let txt='';const r=new SR();r.lang='en-US';r.interimResults=true;g.rec=r;
    r.onresult=ev=>{txt=[...ev.results].map(x=>x[0].transcript).join(' ');S.query=txt;render()};
    r.onend=()=>{g.rec=null;if(txt.trim())done(txt.trim());else if(S.g.mode==='listen'){S.g.mode='idle';S.query='';say('No voice heard. Try again.')}};
    try{r.start()}catch(e){done(Q)}return;
  }
  const w=Q.split(' ');let i=0;const step=()=>{if(S.g.mode!=='listen')return;i++;S.query=w.slice(0,i).join(' ');render();if(i<w.length)later(260,step);else done(Q)};later(900,step);
}

/* ---------- Real camera (MediaPipe Gesture Recognizer) ---------- */
let camStream=null,recog=null,camLoopOn=false,camStatus='Starting camera…',lastPose=null;
async function camStart(){
  if(camStream)return;
  try{
    camStatus='Starting camera…';
    camStream=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240}});
    render();
    if(!recog){
      camStatus='Loading hand model…';render();
      const v=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
      const fs=await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      recog=await v.GestureRecognizer.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task'},runningMode:'VIDEO',numHands:1});
    }
    camStatus='Show your hand';render();camLoopOn=true;camLoop();
  }catch(e){camStop();OPT.cam='sim';pocSync();say('Camera or hand model not available here. Using simulated gestures (keys).',4000)}
}
function camStop(){camLoopOn=false;if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null}
function camLoop(){
  if(!camLoopOn)return;requestAnimationFrame(camLoop);
  const v=$('#camv');if(!v||v.readyState<2||!recog)return;
  if(!S.g.on||S.g.frozen||['off','paused','listen','tab'].includes(S.g.mode))return;
  let r;try{r=recog.recognizeForVideo(v,performance.now())}catch(e){return}
  const has=r.landmarks&&r.landmarks.length;
  const name=has&&r.gestures[0]&&r.gestures[0][0]&&r.gestures[0][0].score>.6?r.gestures[0][0].categoryName:'None';
  const pose={Victory:'peace',Thumb_Up:'thumb',Pointing_Up:'point',Closed_Fist:'fist'}[name]||null;
  const st=$('#camst');if(st)st.textContent=has?(pose?POSES[pose]?POSES[pose][1]:'Fist':'Hand seen'):'Show your hand';
  if(!has){if(S.g.mode==='hold')gRelease();lastPose=null;return}
  gArmAutoOff();
  if(pose==='fist'){if(S.g.mode==='confirm')gCancel();else if(S.g.mode==='hold')gRelease();lastPose=pose;return}
  if(pose&&pose!==lastPose)gPress(pose);
  if(!pose&&S.g.mode==='hold')gRelease();
  lastPose=pose;
}

/* ---------- Gesture Shortcuts setup wizard (2 min) ---------- */
const WZ=['Camera check','Choose shortcuts','Practice','Done'];
function wizOpen(step){S.wiz={step,prac:{peace:false,fist:false},p:0};if(OPT.cam==='real')camStart();render()}
function wizClose(){S.wiz=null;if(!S.g.on)camStop();render()}
function wizNext(){const w=S.wiz;if(w.step<3){w.step++;if(w.step===3){S.g.setup=true;S.g.on=true;S.g.mode='idle';gArmAutoOff()}render()}}
let wzI=0;
function wizPrac(p){const w=S.wiz;if(!w||w.step!==2)return;
  if(p==='fist'){if(w.prac.peace){w.prac.fist=true;render()}return}
  clearInterval(wzI);w.p=0;wzI=setInterval(()=>{w.p+=40/800;const b=$('#wzbar');if(b)b.style.width=Math.min(100,w.p*100)+'%';if(w.p>=1){clearInterval(wzI);w.prac.peace=true;w.p=0;render()}},40)}
function wizRel(){if(!S.wiz||S.wiz.prac.peace)return;clearInterval(wzI);S.wiz.p=0;const b=$('#wzbar');if(b)b.style.width='0%'}
function wizard(){
  const w=S.wiz,st=w.step,M=S.g.map;
  let body='';
  if(st===0)body=`<div class="camb">${OPT.cam==='real'?'<video id="wzv" muted playsinline></video>':`${handSvg('peace',56,'#8CA2FF')}<span>Camera preview (simulated)</span>`}</div>
    <div class="chk"><span>${ic('ccheck',18,2).replace('currentColor','#067647')}Camera found</span><span>${ic('ccheck',18,2).replace('currentColor','#067647')}Good light</span><span>${ic('ccheck',18,2).replace('currentColor','#067647')}Hand visible at about 1 m</span></div>
    <div class="blk">${ic('lock',18)}Video stays on this device and is never recorded.</div>`;
  if(st===1)body=['peace','thumb','point'].map(k=>`<div class="maprow">${handSvg(k,40,A)}<span class="x"><b>${POSES[k][1]}</b><small>Hold 0.8 s</small></span>
     <select data-map="${k}" aria-label="Shortcut for ${POSES[k][1]}">${GSHORT.map(o=>`<option value="${o.id}"${M[k]===o.id?' selected':''}>${o.target}</option>`).join('')}</select></div>`).join('')
    +`<div class="maprow">${handSvg('fist',40)}<span class="x"><b>Fist</b><small>Always cancels a shortcut</small></span></div>
    <div class="blk">${ic('lock',18)}Billing, Manage Members, Settings and Log out can’t be assigned to a gesture.</div>`;
  if(st===2)body=`<p style="margin:0 0 14px;color:var(--t3);font-size:15px">Try it once. Hold the chip (or key <b>V</b>), then press <b>F</b> for a fist.</p><div class="prc">
     <button class="chip${w.prac.peace?' on':''}" data-prac="peace" type="button">${handSvg('peace',40,A)}<span class="x"><b>1. Hold the V sign 0.8 s</b><small>${w.prac.peace?'<span class="ok">Done ✓</span>':'Press and hold'}</small></span><span class="bar" id="wzbar" style="width:${w.prac.peace?100:0}%"></span></button>
     <button class="chip${w.prac.fist?' on':''}" data-prac="fist" type="button" ${w.prac.peace?'':'disabled'}>${handSvg('fist',40,w.prac.fist?A:'#344054')}<span class="x"><b>2. Make a fist to cancel</b><small>${w.prac.fist?'<span class="ok">Done ✓</span>':'Tap or press F'}</small></span></button></div>`;
  if(st===3)body=`<div class="clr"><span class="ck">${ic('check',24,2.2).replace('currentColor',A)}</span><div><h2 style="margin:0;font-size:22px">Gesture Shortcuts are on</h2><p style="margin:4px 0 0;color:var(--t3)">Show a pose to the camera on Home.</p></div></div>
    <div style="margin-top:16px">${['peace','thumb','point'].map(k=>`<div class="maprow">${handSvg(k,34,A)}<span class="x"><b>${POSES[k][1]}</b><small>${gsh(M[k]).target}</small></span></div>`).join('')}</div>`;
  const canNext=st!==2||(w.prac.peace&&w.prac.fist);
  return`<div class="scrim" data-a="wclose"></div><div class="wz" role="dialog" aria-modal="true" aria-labelledby="wzh">
   <div class="wh"><div><h3 id="wzh">Set up Gesture Shortcuts</h3><p>About 2 minutes · Step ${st+1} of 4</p></div><button class="close" data-a="wclose" type="button">Close</button></div>
   <ol>${WZ.map((l,i)=>`<li class="${i<=st?'on':''}">${l}</li>`).join('')}</ol>
   <div class="wb">${body}</div>
   <div class="wf">${st<3?`<button class="sec" data-a="wback" type="button">${st?'Back':'Cancel'}</button><span class="sp"></span>${st===2?`<button class="sec" data-a="wnext" type="button">Skip practice</button>`:''}<button class="pri" data-a="wnext" type="button" ${canNext?'':'disabled style="opacity:.45"'}>${st===0?'Camera works':st===1?'Save shortcuts':'Finish'}</button>`:`<span class="sp"></span><button class="pri" data-a="wdone" type="button">Go to Home</button>`}</div>
  </div>`;
}
